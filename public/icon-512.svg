<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rich Background Deep Emerald Gradient -->
    <linearGradient id="bgRichEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0a3d28" />
      <stop offset="40%" stopColor="#052417" />
      <stop offset="100%" stopColor="#011009" />
    </linearGradient>

    <!-- 3D Gold Rim Bezel -->
    <linearGradient id="goldBezel3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFBEB" />
      <stop offset="12%" stopColor="#FDE68A" />
      <stop offset="28%" stopColor="#F59E0B" />
      <stop offset="45%" stopColor="#B45309" />
      <stop offset="65%" stopColor="#78350F" />
      <stop offset="82%" stopColor="#FDE68A" />
      <stop offset="100%" stopColor="#451A03" />
    </linearGradient>

    <!-- Super Bright Gold Metallic -->
    <linearGradient id="goldEagleMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="18%" stopColor="#FEF08A" />
      <stop offset="45%" stopColor="#F59E0B" />
      <stop offset="75%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#78350F" />
    </linearGradient>

    <!-- Specular Bright Gold for Wings Highlight -->
    <linearGradient id="goldWingHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFDF0" />
      <stop offset="30%" stopColor="#FDE68A" />
      <stop offset="70%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#92400E" />
    </linearGradient>

    <!-- 3D Gold Typography Gradient -->
    <linearGradient id="textGold3D" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="22%" stopColor="#FFF7C2" />
      <stop offset="55%" stopColor="#F59E0B" />
      <stop offset="85%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#713F12" />
    </linearGradient>

    <!-- Ruby Red 3D Stars -->
    <linearGradient id="rubyRed3D" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FCA5A5" />
      <stop offset="25%" stopColor="#EF4444" />
      <stop offset="65%" stopColor="#B91C1C" />
      <stop offset="100%" stopColor="#450A0A" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadowSolid" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" floodColor="#000000" floodOpacity="0.85" />
    </filter>
  </defs>

  <!-- 1. SOLID BASE APP ICON (Square Squircle with Gold Border) -->
  <rect width="512" height="512" fill="#000000" />
  
  <!-- Outer Gold Bezel -->
  <rect x="12" y="12" width="488" height="488" rx="105" fill="url(#goldBezel3D)" stroke="#270F02" stroke-width="4" />
  <!-- Inner Dark Bevel -->
  <rect x="22" y="22" width="468" height="468" rx="95" fill="#140A01" />
  <!-- Main Deep Emerald Card Face -->
  <rect x="26" y="26" width="460" height="460" rx="91" fill="url(#bgRichEmerald)" stroke="url(#goldBezel3D)" stroke-width="2" />

  <!-- 2. SYRIAN FLAG EMBLEMATIC HORIZONTAL BANDS -->
  <g filter="url(#shadowSolid)">
    <!-- Top Green Stripe -->
    <path d="M 28 108 Q 256 128 484 108 L 484 148 Q 256 168 28 148 Z" fill="#007A3D" opacity="0.95" />
    <!-- Center Pure White Stripe -->
    <path d="M 28 148 Q 256 168 484 148 L 484 212 Q 256 232 28 212 Z" fill="#F8FAFC" />
    <!-- Bottom Black Stripe -->
    <path d="M 28 212 Q 256 232 484 212 L 484 250 Q 256 270 28 250 Z" fill="#090E17" />
  </g>

  <!-- Two Syrian Flag Red Stars on White Band -->
  <g filter="url(#shadowSolid)">
    <!-- Left Star on Flag -->
    <polygon points="106,160 110,172 123,172 112,180 116,193 106,185 96,193 100,180 89,172 102,172" fill="url(#rubyRed3D)" stroke="#580808" stroke-width="0.8" />
    <!-- Right Star on Flag -->
    <polygon points="406,160 410,172 423,172 412,180 416,193 406,185 396,193 400,180 389,172 402,172" fill="url(#rubyRed3D)" stroke="#580808" stroke-width="0.8" />
  </g>

  <!-- 3. TOP THREE 5-POINT GOLD STARS -->
  <g fill="url(#goldEagleMetal)" filter="url(#shadowSolid)">
    <!-- Center Gold Star -->
    <polygon points="256,48 261,61 275,61 264,69.5 268,83 256,74.5 244,83 248,69.5 237,61 251,61" stroke="#582400" stroke-width="0.7" />
    <!-- Left Gold Star -->
    <polygon points="202,56 206.5,68 219.5,68 209,76 213,88.5 202,80.5 191,88.5 195,76 184.5,68 197.5,68" stroke="#582400" stroke-width="0.7" transform="rotate(-12 202 70)" />
    <!-- Right Gold Star -->
    <polygon points="310,56 314.5,68 327.5,68 317,76 321,88.5 310,80.5 299,88.5 303,76 292.5,68 305.5,68" stroke="#582400" stroke-width="0.7" transform="rotate(12 310 70)" />
  </g>

  <!-- 4. HIGH-PRECISION 3D GOLDEN SYRIAN EAGLE -->
  <g filter="url(#shadowSolid)">
    <!-- Main Wings Outer Contour -->
    <path d="M 256 126 C 205 85 152 105 136 122 C 160 152 195 186 226 166 C 242 156 256 162 256 162 Z" fill="url(#goldWingHighlight)" stroke="#451A03" stroke-width="0.8" />
    <path d="M 256 126 C 307 85 360 105 376 122 C 352 152 317 186 286 166 C 270 156 256 162 256 162 Z" fill="url(#goldWingHighlight)" stroke="#451A03" stroke-width="0.8" />

    <!-- Left Wing Feathers Detailed Hierarchy -->
    <path d="M 138 124 Q 166 150 198 196 Q 174 176 152 150 Z" fill="url(#goldEagleMetal)" stroke="#3E1700" stroke-width="0.5" />
    <path d="M 154 136 Q 180 160 208 206 Q 188 184 168 160 Z" fill="url(#goldWingHighlight)" />
    <path d="M 172 148 Q 196 172 220 214 Q 202 192 186 170 Z" fill="url(#goldEagleMetal)" />
    <path d="M 190 158 Q 212 182 232 220 Q 218 200 204 180 Z" fill="url(#goldWingHighlight)" />

    <!-- Right Wing Feathers Detailed Hierarchy -->
    <path d="M 374 124 Q 346 150 314 196 Q 338 176 360 150 Z" fill="url(#goldEagleMetal)" stroke="#3E1700" stroke-width="0.5" />
    <path d="M 358 136 Q 332 160 304 206 Q 324 184 344 160 Z" fill="url(#goldWingHighlight)" />
    <path d="M 340 148 Q 316 172 292 214 Q 310 192 326 170 Z" fill="url(#goldEagleMetal)" />
    <path d="M 322 158 Q 300 182 280 220 Q 294 200 308 180 Z" fill="url(#goldWingHighlight)" />

    <!-- Tail Feathers Fan -->
    <path d="M 230 208 L 256 248 L 282 208 L 270 192 L 242 192 Z" fill="url(#goldEagleMetal)" stroke="#451A03" stroke-width="0.8" />
    <path d="M 244 210 L 256 254 L 268 210 Z" fill="url(#goldWingHighlight)" />

    <!-- Talons / Claws -->
    <path d="M 208 202 L 198 220 M 213 205 L 213 223 M 219 202 L 225 220" stroke="#FFF7C2" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 304 202 L 314 220 M 299 205 L 299 223 M 293 202 L 287 220" stroke="#FFF7C2" stroke-width="3.5" stroke-linecap="round" />

    <!-- Eagle Chest Shield -->
    <path d="M 228 152 Q 256 142 284 152 Q 276 200 256 210 Q 236 200 228 152 Z" fill="url(#goldWingHighlight)" stroke="#451A03" stroke-width="1.2" />
    <path d="M 238 160 Q 256 152 274 160 Q 268 190 256 198 Q 244 190 238 160 Z" fill="url(#goldEagleMetal)" />

    <!-- Eagle Center Red Star under Chest -->
    <polygon points="256,244 260,256 272,256 262.5,263 266,275 256,268 246,275 249.5,263 240,256 252,256" fill="url(#rubyRed3D)" stroke="#580808" stroke-width="0.7" />

    <!-- Eagle Head & Beak Profile -->
    <path d="M 240 114 Q 256 98 270 110 Q 282 118 268 130 Q 254 136 240 114 Z" fill="url(#goldWingHighlight)" stroke="#451A03" stroke-width="1" />
    <!-- Beak Hook -->
    <path d="M 270 110 Q 284 114 272 123 Z" fill="#92400E" stroke="#FEF08A" stroke-width="0.8" />
    <!-- Eagle Eye -->
    <circle cx="257" cy="112" r="2.8" fill="#000000" />
    <circle cx="257.8" cy="111.2" r="0.9" fill="#FFFFFF" />
  </g>

  <!-- 5. 3D GOLDEN TYPOGRAPHY "الأسواق السورية" (Super Crisp Contrast) -->
  <g filter="url(#shadowSolid)">
    <!-- Word 1: الأسواق -->
    <text
      x="256"
      y="350"
      text-anchor="middle"
      fill="url(#textGold3D)"
      stroke="#270F02"
      stroke-width="5"
      paint-order="stroke fill"
      font-size="74"
      font-weight="900"
      font-family="'Cairo', 'Arial Black', Tahoma, sans-serif"
    >
      الأسواق
    </text>

    <!-- Word 2: السورية -->
    <text
      x="256"
      y="430"
      text-anchor="middle"
      fill="url(#textGold3D)"
      stroke="#270F02"
      stroke-width="5"
      paint-order="stroke fill"
      font-size="70"
      font-weight="900"
      font-family="'Cairo', 'Arial Black', Tahoma, sans-serif"
    >
      السورية
    </text>
  </g>

  <!-- 6. THREE RUBY RED STARS AT THE BOTTOM -->
  <g fill="url(#rubyRed3D)" filter="url(#shadowSolid)">
    <!-- Center Star -->
    <polygon points="256,446 261,460 276,460 264,469 268.5,483 256,474.5 243.5,483 248,469 236,460 251,460" stroke="#450A0A" stroke-width="0.9" />
    <!-- Left Star -->
    <polygon points="194,450 198.5,463 213,463 201.5,471 205.5,484 194,476 182.5,484 186.5,471 175,463 189.5,463" stroke="#450A0A" stroke-width="0.9" />
    <!-- Right Star -->
    <polygon points="318,450 322.5,463 337,463 325.5,471 329.5,484 318,476 306.5,484 310.5,471 299,463 313.5,463" stroke="#450A0A" stroke-width="0.9" />
  </g>
</svg>
