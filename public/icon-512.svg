<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#0d1b2a" />
      <stop offset="60%" stopColor="#0b1320" />
      <stop offset="100%" stopColor="#050811" />
    </radialGradient>

    <!-- Metallic Gold 3D Gradient -->
    <linearGradient id="goldRim3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF7C2" />
      <stop offset="20%" stopColor="#F59E0B" />
      <stop offset="40%" stopColor="#B45309" />
      <stop offset="60%" stopColor="#FBBF24" />
      <stop offset="80%" stopColor="#78350F" />
      <stop offset="100%" stopColor="#FEF08A" />
    </linearGradient>

    <!-- Specular Bright Gold -->
    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="25%" stopColor="#FEF08A" />
      <stop offset="65%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#78350F" />
    </linearGradient>

    <!-- Deep Emerald Green Radial Background -->
    <radialGradient id="deepGreenRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#0B3C2A" />
      <stop offset="65%" stopColor="#042217" />
      <stop offset="90%" stopColor="#02150D" />
      <stop offset="100%" stopColor="#052E1F" />
    </radialGradient>

    <!-- Text Gold -->
    <linearGradient id="goldText3D" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFBEB" />
      <stop offset="30%" stopColor="#FCD34D" />
      <stop offset="70%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#78350F" />
    </linearGradient>

    <filter id="shadow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" floodColor="#000000" floodOpacity="0.9" />
    </filter>
  </defs>

  <!-- Background base for splash/icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ambient Glow -->
  <circle cx="256" cy="216" r="170" fill="#f59e0b" opacity="0.15" filter="blur(20px)" />

  <!-- Medallion Center -->
  <g filter="url(#shadow3D)">
    <circle cx="256" cy="200" r="150" fill="url(#goldRim3D)" stroke="#582900" stroke-width="3" />
    <circle cx="256" cy="200" r="136" fill="#1C1408" opacity="0.6" />
    <circle cx="256" cy="200" r="132" fill="url(#goldRim3D)" opacity="0.9" />
    <circle cx="256" cy="200" r="126" fill="url(#deepGreenRadial)" stroke="url(#goldRim3D)" stroke-width="2.5" />
    <circle cx="256" cy="200" r="116" fill="none" stroke="url(#goldBright)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7" />
  </g>

  <!-- Stars -->
  <g fill="url(#goldBright)" filter="url(#shadow3D)">
    <polygon points="256,90 261,102 274,102 263.5,110 267.5,123 256,115 244.5,123 248.5,110 238,102 251,102" />
    <polygon points="212,98 216,109 227,109 218.5,116 221.5,127 212,120 202.5,127 205.5,116 197,109 208,109" transform="rotate(-12 212 112)" />
    <polygon points="300,98 304,109 315,109 306.5,116 309.5,127 300,120 290.5,127 293.5,116 285,109 296,109" transform="rotate(12 300 112)" />
  </g>

  <!-- Eagle Emblem -->
  <g fill="url(#goldRim3D)" stroke="#3E1A00" stroke-width="0.8" filter="url(#shadow3D)">
    <path d="M 256 150 Q 200 114 132 136 Q 160 170 190 200 Q 222 176 256 186 Z" fill="url(#goldBright)" />
    <path d="M 256 150 Q 312 114 380 136 Q 352 170 322 200 Q 290 176 256 186 Z" fill="url(#goldBright)" />

    <path d="M 138 138 Q 166 161 194 208 Q 170 188 148 164 Z" fill="url(#goldRim3D)" />
    <path d="M 156 150 Q 180 172 204 216 Q 184 196 164 174 Z" fill="url(#goldBright)" />

    <path d="M 374 138 Q 346 161 318 208 Q 342 188 364 164 Z" fill="url(#goldRim3D)" />
    <path d="M 356 150 Q 332 172 308 216 Q 328 196 348 174 Z" fill="url(#goldBright)" />

    <path d="M 234 232 L 256 270 L 278 232 L 267 212 L 245 212 Z" fill="url(#goldBright)" />
    <path d="M 245 235 L 256 276 L 267 235 Z" fill="url(#goldRim3D)" />

    <path d="M 206 226 L 198 246 M 209 229 L 209 249 M 215 226 L 220 246" stroke="#FEF08A" stroke-width="3" stroke-linecap="round" />
    <path d="M 306 226 L 314 246 M 303 229 L 303 249 M 297 226 L 292 246" stroke="#FEF08A" stroke-width="3" stroke-linecap="round" />

    <path d="M 231 174 Q 256 162 281 174 Q 273 220 256 232 Q 239 220 231 174 Z" fill="url(#goldBright)" stroke="#582900" stroke-width="1.2" />

    <path d="M 242 136 Q 256 122 267 133 Q 278 139 264 150 Q 253 155 242 136 Z" fill="url(#goldBright)" stroke="#3E1A00" stroke-width="1.2" />
    <path d="M 267 133 Q 280 136 270 144 Z" fill="#78350F" stroke="#FEF08A" stroke-width="1" />
    <circle cx="256" cy="133" r="2.5" fill="#02150D" />
  </g>

  <!-- Typography OMS MARKET -->
  <g filter="url(#shadow3D)">
    <text x="256" y="405" text-anchor="middle" fill="url(#goldText3D)" stroke="#451A00" stroke-width="1.6" font-size="52" font-weight="900" font-family="Georgia, serif" letter-spacing="4">OMS</text>
    <text x="256" y="460" text-anchor="middle" fill="url(#goldText3D)" stroke="#451A00" stroke-width="1.2" font-size="34" font-weight="bold" font-family="'Cairo', Tahoma, sans-serif">الأسواق السورية</text>
  </g>
</svg>
